# office-crew-ci-gates: strict-v10
# Auto-generated for fullstack projects v5 (GitHub Actions).
# Convention: Python backend in backend/, JS frontend in frontend/.
# v5 is a SHARED marker bump, not a change here: the one version string is checked
# against both provider templates (`_select_ci_template`), and v5 is the GitLab
# side turning its stage list into a DAG. Actions already dispatches independent
# jobs concurrently, so this file needs nothing to get the same property.
# Each job NO-OPS gracefully when its part is absent on the branch: the
# orchestrator splits a sprint into per-file tickets across waves, so a single
# feature branch often carries only the backend OR only the frontend slice. A
# rigid `cd backend` / `npm ci` would red-fail every such branch even though the
# code is correct, blocking the merge that would have brought the missing part.
name: CI
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - shell: bash
        run: |
          if [ ! -d backend ]; then echo "No backend/ on this branch — skip"; exit 0; fi
          python -m pip install --upgrade pip
          # requirements.txt may sit in backend/ OR at the repo root — install both.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          cd backend
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || pip install .; fi
          # httpx2: fastapi.testclient → starlette.testclient requires it and
          # raises at import time without it (kills the whole collection).
          pip install pytest pytest-cov httpx2 httpx
          # Coverage reported, not merge-blocking — see the python template above.
          PYTHONPATH=. pytest -v --cov=. --cov-report=term || test $? -eq 5
      - shell: bash
        run: |
          export OFFICE_CREW_RC_STACKS='python'
          # A green test suite is not a running product: the suite builds its own fixtures
          # and skips the real start path. This starts the product for real, from its own
          # RUN.json, and probes the health path that file declares.
          #
          # SCOPE (OFFICE_CREW_RC_STACKS): only the services whose stack THIS job installed.
          # A job that ran `pip install` can start the Python service; it cannot start a Node
          # service whose node_modules were installed on a DIFFERENT runner in a different job.
          # Trying anyway is a red no developer can repair, and this step never runs RUN.json's
          # own `install` commands — measured 2026-07-28 (OfficeCloset7): every PR went red on
          # `npm run dev` inside the backend job while pytest, ruff and the frontend build were
          # all green, then merged on red because the repair rounds had nothing to fix.
          # Out-of-scope services are NAMED and deferred to the pre-merge gate, which does run
          # the RUN.json install steps for real.
          if [ ! -f RUN.json ]; then echo "No RUN.json — skip"; exit 0; fi
          # `python` is not on PATH on every runner image (a node: image has none, and an
          # Actions job without setup-python only has python3). Resolve it, or skip honestly.
          OFFICE_CREW_PY=$(command -v python3 || command -v python)
          if [ -z "$OFFICE_CREW_PY" ]; then echo "No python on this runner — run contract skipped"; exit 0; fi
          "$OFFICE_CREW_PY" - <<'OFFICE_CREW_RUN_CONTRACT'
          import json, os, secrets, subprocess, sys, time, urllib.request, urllib.error

          try:
              doc = json.load(open("RUN.json", encoding="utf-8"))
          except Exception as e:
              sys.exit("RUN.json is not readable JSON: %s" % e)
          if doc.get("runcontract") != 1:
              print("RUN.json is not an office-crew run contract — skip"); raise SystemExit(0)

          # Empty scope = "this job prepared everything" (the historical behaviour).
          scopes = {s.strip() for s in (os.environ.get("OFFICE_CREW_RC_STACKS") or "").split(",") if s.strip()}

          failures = []
          started = []
          deferred = []
          for svc in doc.get("services", []):
              name, where = svc.get("name", "?"), svc.get("dir", ".")
              if svc.get("kind") != "server" or not svc.get("start"):
                  continue
              stack = svc.get("stack") or "?"
              if scopes and stack not in scopes:
                  deferred.append("%s (%s)" % (name, stack))
                  print("%s: stack '%s' is not installed in this job - deferred to the pre-merge "
                        "gate, which runs its RUN.json install steps" % (name, stack))
                  continue
              if not os.path.isdir(where):
                  print("%s: %s/ not on this branch — skip" % (name, where)); continue
              port = int(svc.get("port") or 8000)
              env = dict(os.environ)
              for key, spec in (svc.get("env") or {}).items():
                  if spec.get("external"):
                      continue          # the product must boot WITHOUT it — that is the test
                  if spec.get("generate"):
                      env[key] = secrets.token_hex(int(spec.get("bytes") or 32))
                  else:
                      env[key] = str(spec.get("dev", ""))
              if svc.get("port_env"):
                  env[svc["port_env"]] = str(port)
              argv = [a.replace("${python}", sys.executable).replace("${PORT}", str(port))
                      for a in svc["start"]]
              if any("${" in a for a in argv):
                  failures.append("%s: unresolved placeholder in start" % name); continue
              print("::group::%s" % name); print("starting:", " ".join(argv))
              # Its own process group, so the kill below can reach everything it spawned.
              proc = subprocess.Popen(argv, cwd=where, env=env,
                                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
                                      start_new_session=True)
              path = (svc.get("health") or {}).get("path") or "/"
              want = set((svc.get("health") or {}).get("expect_status") or [200])
              deadline = time.time() + min(int(svc.get("ready_timeout_s") or 30), 60)
              status = None
              try:
                  while time.time() < deadline and proc.poll() is None:
                      try:
                          with urllib.request.urlopen("http://127.0.0.1:%d%s" % (port, path), timeout=2) as r:
                              status = r.status
                      except urllib.error.HTTPError as he:
                          status = he.code
                      except OSError:
                          time.sleep(0.5); continue
                      break
                  if proc.poll() is not None:
                      failures.append("%s: exited with %s before answering %s" % (name, proc.returncode, path))
                  elif status is None:
                      failures.append("%s: never answered %s within the declared timeout" % (name, path))
                  elif status not in want:
                      failures.append("%s: %s answered %s, RUN.json expects %s"
                                      % (name, path, status, sorted(want)))
                  else:
                      started.append(name)
                      print("%s: %s answered %s" % (name, path, status))
              finally:
                  # Kill the TREE, and never wait forever for the pipe. A server that forks —
                  # a reloader, a gunicorn master, `npm run dev` — leaves children holding the
                  # stdout write handle, so `proc.kill()` reaches the parent only and
                  # `communicate()` then waits for an EOF that cannot come. Measured
                  # 2026-07-29 (run 20260729-222525): the pipeline sat in this step for
                  # 9 minutes on its way to GitHub's six-hour job ceiling. `argv_allowed` now
                  # rejects `--reload` before it can be declared, but a step that can deadlock
                  # at all is a step that will, so bound it here too.
                  try:
                      os.killpg(os.getpgid(proc.pid), 9)
                  except Exception:
                      pass
                  if proc.poll() is None:
                      proc.kill()
                  try:
                      out = (proc.communicate(timeout=15)[0] or "")[-2000:]
                  except Exception:
                      out = "(output not drained: the product left a child holding the pipe)"
                  if out.strip():
                      print(out)
                  print("::endgroup::")

          if failures:
              sys.exit("the product does not start the way RUN.json says:\n- " + "\n- ".join(failures))
          # Say what was actually proven. A summary that claims more than the job checked is
          # how an unverified service becomes an invisible one.
          print("run contract: started and probed %s" % (", ".join(started) if started else "nothing"))
          if deferred:
              print("run contract: NOT checked here (wrong job for the stack): %s" % ", ".join(deferred))
          OFFICE_CREW_RUN_CONTRACT
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - shell: bash
        run: |
          if [ ! -d backend ]; then echo "No backend/ on this branch — skip"; exit 0; fi
          cd backend
          pip install ruff==0.16.0
          ruff format --check . || true
          ruff check --select E9,F,B --ignore B008 .
          ruff check . || true
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: bash
        run: |
          if [ ! -d frontend ]; then echo "No frontend/ on this branch — skip"; exit 0; fi
          cd frontend
          if [ -f package.json ]; then
            # npm-based frontend (Vite/React/…): install, optional test, optional build.
            if [ -f package-lock.json ]; then npm ci --no-audit --no-fund || npm install --no-audit --no-fund; else npm install --no-audit --no-fund; fi
            if grep -q '"test"' package.json; then T=$(sed -n 's/.*"test"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -1); A=''; case "$T" in *vitest*) case "$T" in *--run*|*" run"*) ;; *) A="--run";; esac; case "$T" in *--passWithNoTests*) ;; *) A="$A --passWithNoTests";; esac;; *jest*) case "$T" in *--passWithNoTests*) ;; *) A="--passWithNoTests";; esac;; esac; if [ -n "$A" ]; then npm test -- $A; else npm test; fi; else echo 'No test script in package.json — skip'; fi
            if grep -q '"build"' package.json; then npm run build; fi
          else
            # Vanilla HTML/CSS/JS — no npm. Run node:test on any *.test.mjs/.js.
            shopt -s nullglob
            tests=(tests/*.test.mjs tests/*.test.js src/*.test.mjs)
            if [ ${#tests[@]} -gt 0 ]; then
              echo "Running ${#tests[@]} node test file(s)…"
              node --test "${tests[@]}"
            else
              echo "Vanilla frontend without node tests — accepted"
            fi
          fi
